services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: logbook
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logbook -d logbook"]
      interval: 10s
      timeout: 5s
      retries: 5

  traccar:
    image: traccar/traccar:6.14.4
    restart: unless-stopped
    volumes:
      - traccar-data:/opt/traccar/data
      # voliteľné: cp traccar/traccar.xml.example traccar/traccar.xml a odkomentuj
      # - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    ports:
      - "8082:8082"   # Traccar web UI
      - "5055:5055"   # OsmAnd / Traccar Client protokol (telefóny)

  logbook:
    build: ./backend
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://logbook:${POSTGRES_PASSWORD}@db:5432/logbook
      TRACCAR_URL: http://traccar:8082/api
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      traccar:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  db-data:
  traccar-data:
